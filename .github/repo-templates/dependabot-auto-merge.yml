# Copy to repos/<name>/.github/workflows/dependabot-auto-merge.yml
# Auto-merge safe Dependabot PRs (github-actions bumps only).
# Requires: branch protection allows auto-merge OR admin bypass.
name: Dependabot Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # fetch-metadata emits `github_actions` (underscore), not `github-actions`.
      # The hyphenated form never matched, so this step silently no-op'd while
      # the job still reported success.
      - name: Auto-merge github-actions bumps
        if: steps.meta.outputs.package-ecosystem == 'github_actions' && (steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor')
        # `gh pr merge` resolves the target repo from the local git remote, and
        # this job has no checkout — pass -R explicitly instead of cloning.
        run: |
          pkg="${{ steps.meta.outputs.dependency-names }}"
          if echo "$pkg" | grep -qiE 'actions/|docker/|pnpm/action|hashicorp/|astral-sh/'; then
            gh pr merge --auto --squash -R "${{ github.repository }}" "${{ github.event.pull_request.number }}"
          else
            echo "Skipping auto-merge for: $pkg"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A skipped merge step is invisible in the checks UI (the job goes green
      # either way). Log the reason so the next ecosystem-name mismatch is
      # visible in the run without diffing workflow YAML.
      - name: Report skipped auto-merge
        if: steps.meta.outputs.package-ecosystem != 'github_actions' || (steps.meta.outputs.update-type != 'version-update:semver-patch' && steps.meta.outputs.update-type != 'version-update:semver-minor')
        run: |
          echo "Auto-merge not attempted for PR #${{ github.event.pull_request.number }}"
          echo "  package-ecosystem: '${{ steps.meta.outputs.package-ecosystem }}' (auto-merge covers 'github_actions')"
          echo "  update-type:       '${{ steps.meta.outputs.update-type }}' (auto-merge covers semver-patch/minor)"
          echo "Leaving PR open for manual review."
