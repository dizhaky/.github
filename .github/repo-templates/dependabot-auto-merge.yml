# Copy to repos/<name>/.github/workflows/dependabot-auto-merge.yml
# Read-only reporter; the authenticated AI controller owns native enrollment.
name: Dependabot Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

# Cancel superseded runs of the same PR (new push = old run is moot); pushes
# to main and scheduled runs are never cancelled. Cuts load on the MFC3 runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  report:
    if: github.repository_owner == 'dizhaky'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report PR state to the sole AI delivery controller
        env:
          GH_TOKEN: ${{ github.token }}
          DELIVERY_REPOSITORY: ${{ github.repository }}
        run: |
          gh api --paginate --slurp \
            "repos/$DELIVERY_REPOSITORY/pulls?state=open&per_page=100" \
            --jq '[.[][] | {number, draft, head: .head.sha, nativeQueueArmed: (.auto_merge != null)}]'
          echo 'Native enrollment is owned by the authenticated AI delivery controller.'
