# Copy to repos/<name>/.github/workflows/secret-scan-alert.yml
# Opt-in: opens a deduplicated GitHub issue (and optionally posts to Slack) when
# Secret Scan goes red on the default branch, and closes it again on recovery.
#
# workflow_run must be declared here rather than in the reusable workflow --
# it only fires from the default branch copy of this file.
name: Secret Scan Alert

on:
  workflow_run:
    workflows: ["Secret Scan"]
    types: [completed]
  # Rehearsal only. Lets the alert path be exercised deliberately without ever
  # making a branch red to test it.
  workflow_dispatch:
    inputs:
      conclusion:
        description: "Rehearsal: which path to exercise"
        type: choice
        options: [failure, success]
        default: failure

permissions:
  contents: read

jobs:
  alert:
    # Default branch only. A red PR is already in front of its author; a red
    # default branch is the one nobody is looking at.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    permissions:
      contents: read
      issues: write
      actions: read
    uses: dizhaky/.github/.github/workflows/reusable-scan-failure-alert.yml@main
    with:
      workflow-name: ${{ github.event.workflow_run.name || 'Secret Scan' }}
      run-id: ${{ github.event.workflow_run.id || github.run_id }}
      run-url: ${{ github.event.workflow_run.html_url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
      branch: ${{ github.event.workflow_run.head_branch || github.ref_name }}
      commit: ${{ github.event.workflow_run.head_sha || github.sha }}
      conclusion: ${{ github.event_name == 'workflow_dispatch' && inputs.conclusion || github.event.workflow_run.conclusion }}
      # Name the artifact the scan publishes, so the alert can say where the
      # finding is. Leave empty if the scan publishes no report.
      artifact-name: gitleaks-report
    secrets:
      # Passed explicitly rather than `secrets: inherit` -- the alert needs this
      # one and nothing else. Undefined resolves to empty, which the reusable
      # workflow treats as "Slack not configured" and skips without failing.
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
