name: Reusable Nightly Maintenance

on:
  workflow_call:
    inputs:
      auto-fix:
        type: boolean
        default: false
        description: "Open a PR with safe auto-fixes (ruff, npm audit fix)"
      python-fix:
        type: boolean
        default: true
      node-fix:
        type: boolean
        default: true
      full-secret-scan:
        type: boolean
        default: true

permissions:
  contents: read
  security-events: read

jobs:
  secret-scan:
    if: inputs.full-secret-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install gitleaks
        run: |
          for attempt in 1 2 3; do
            if curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
              | tar -xz -C /usr/local/bin gitleaks; then
              exit 0
            fi
            echo "gitleaks download failed (attempt ${attempt}/3), retrying..."
            sleep 5
          done
          exit 1

      - name: Rolling secret scan (since 2 days ago)
        id: scan
        shell: bash
        run: |
          set -euo pipefail
          since=$(date -u -d '2 days ago' +%Y-%m-%dT%H:%M:%SZ)
          echo "## Secret scan (rolling 2-day window)" >> "$GITHUB_STEP_SUMMARY"
          echo "Since: ${since}" >> "$GITHUB_STEP_SUMMARY"
          # --verbose already prints redacted findings to the job log; the report
          # adds a machine-readable copy so the locations can also reach the step
          # summary and an artifact. --redact still masks Match/Secret in it.
          gitleaks detect --redact --exit-code 1 --verbose \
            --report-format json --report-path gitleaks-report.json \
            --log-opts="--since=${since}"

      - name: Report finding locations
        if: failure() && steps.scan.outcome == 'failure'
        shell: bash
        run: |
          set -uo pipefail
          REPORT=gitleaks-report.json
          {
            if [ ! -s "$REPORT" ]; then
              echo "No gitleaks report was written - the scan failed before producing one."
              echo "See the scan step log above for the underlying error."
            elif [ "$(jq 'length' "$REPORT")" = "0" ]; then
              echo "The report contains no findings; this job failed for another reason."
            else
              echo "**$(jq 'length' "$REPORT") finding(s).** Secret values are redacted;"
              echo "the locations below are where to look."
              echo ""
              echo '```'
              jq -r '.[] | "\(.File):\(.StartLine)  rule=\(.RuleID)  commit=\(if .Commit == "" then "working-tree" else .Commit[0:8] end)\n    \(.Description)"' "$REPORT"
              echo '```'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Artifact name is scoped to this job: a caller may run other gitleaks
      # jobs, and upload-artifact v4+ rejects a duplicate name within one run.
      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-report-nightly
          path: gitleaks-report.json
          if-no-files-found: ignore

  alert-report:
    runs-on: ubuntu-latest
    permissions:
      security-events: read
    steps:
      - name: Dependabot alert summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          echo "## Dependabot alerts for ${REPO}" >> "$GITHUB_STEP_SUMMARY"
          for sev in critical high medium low; do
            total=$(gh api "repos/${REPO}/dependabot/alerts?state=open&severity=${sev}&per_page=100" \
              --paginate --jq '[.[]] | length' 2>/dev/null | awk '{s+=$1} END {print s+0}' || true)
            if [ -z "${total}" ]; then
              total="?"
            fi
            echo "- **${sev}**: ${total}" >> "$GITHUB_STEP_SUMMARY"
          done

  auto-fix:
    if: inputs.auto-fix
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Detect ecosystems
        id: detect
        shell: bash
        run: |
          has_python=false
          has_node=false
          [ -f pyproject.toml ] || [ -f requirements.txt ] && has_python=true
          [ -f package.json ] && has_node=true
          echo "python=$has_python" >> "$GITHUB_OUTPUT"
          echo "node=$has_node" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v7
        if: inputs.python-fix && steps.detect.outputs.python == 'true'
        with:
          python-version: "3.12"

      - name: Python auto-fix (ruff)
        if: inputs.python-fix && steps.detect.outputs.python == 'true'
        run: |
          pip install ruff
          ruff check --fix . || true
          ruff format . || true

      - uses: actions/setup-node@v7
        if: inputs.node-fix && steps.detect.outputs.node == 'true'
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v6
        if: inputs.node-fix && steps.detect.outputs.node == 'true' && hashFiles('pnpm-lock.yaml') != ''

      - name: Node auto-fix (audit)
        if: inputs.node-fix && steps.detect.outputs.node == 'true'
        shell: bash
        run: |
          set +e
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile 2>/dev/null || pnpm install
            pnpm audit --fix 2>/dev/null || true
          elif [ -f package-lock.json ]; then
            npm ci 2>/dev/null || npm install
            npm audit fix 2>/dev/null || true
          fi

      - name: Open auto-fix PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: bot/nightly-${{ github.run_id }}
          delete-branch: true
          commit-message: "chore: nightly auto-fix (ruff/audit)"
          title: "chore: nightly auto-fix"
          body: |
            Automated nightly maintenance PR.
            - Python: `ruff check --fix` / `ruff format` where applicable
            - Node: `npm audit fix` / `pnpm audit --fix` where applicable
            Review before merge.
