name: Nightly Account Health Check

on:
  schedule:
    - cron: "0 6 * * *"  # 06:00 UTC daily
  workflow_dispatch:
    inputs:
      auto-fix-repos:
        description: "Comma-separated repos to run auto-fix (empty = report only)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  account-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Scan all repos (requires GH_PAT for private repos)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          AUTO_FIX: ${{ github.event.inputs.auto-fix-repos }}
        run: |
          set -uo pipefail
          echo "# Nightly GitHub Account Health" >> "$GITHUB_STEP_SUMMARY"
          echo "Run: $(date -u +%Y-%m-%dT%H:%MZ)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -z "${GH_PAT:-}" ]; then
            echo "::warning::GH_PAT secret not set — cross-repo scan may fail for private repos. Add a classic PAT with \`repo\` scope to dizhaky/.github secrets."
          fi

          REPO_LIST=$(mktemp)
          if gh api user/repos --paginate -q '.[] | select(.archived==false) | .full_name' > "$REPO_LIST" 2>/dev/null; then
            echo "Using user/repos API" >> "$GITHUB_STEP_SUMMARY"
          elif [ -f scripts/repo-manifest.txt ]; then
            echo "::warning::user/repos unavailable; using scripts/repo-manifest.txt"
            echo "Using repo manifest fallback" >> "$GITHUB_STEP_SUMMARY"
            awk '!/^#/ && NF {print "dizhaky/" $1}' scripts/repo-manifest.txt > "$REPO_LIST"
          else
            echo "::warning::Could not list repos; health check incomplete"
            echo "Repo list unavailable (add GH_PAT or scripts/repo-manifest.txt)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "| Repo | Critical | High | Queued Runs | Failed (24h) |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|----------|------|-------------|--------------|" >> "$GITHUB_STEP_SUMMARY"

          errors=0
          while read -r full; do
            [ -n "$full" ] || continue
            owner="${full%%/*}"
            repo="${full##*/}"
            [ "$owner" = "dizhaky" ] || continue
            [ "$repo" = ".github" ] && continue

            crit=$(gh api "repos/${full}/dependabot/alerts?state=open&severity=critical&per_page=100" \
              --paginate --jq '[.[]] | length' 2>/dev/null | awk '{s+=$1} END {print s+0}' || echo "?")
            high=$(gh api "repos/${full}/dependabot/alerts?state=open&severity=high&per_page=100" \
              --paginate --jq '[.[]] | length' 2>/dev/null | awk '{s+=$1} END {print s+0}' || echo "?")
            queued=$(gh run list -R "$full" --status queued --json databaseId --jq 'length' 2>/dev/null || echo "?")
            failed=$(gh run list -R "$full" --status failure \
              --created "$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -v-24H +%Y-%m-%dT%H:%M:%SZ)" \
              --json databaseId --jq 'length' 2>/dev/null || echo "?")

            echo "| ${repo} | ${crit} | ${high} | ${queued} | ${failed} |" >> "$GITHUB_STEP_SUMMARY"

            PROTECTED_WORKFLOWS="Docker Publish,Quality Gate,Nightly Maintenance" \
            QUEUED_STALE_SECONDS="2700" \
            gh run list -R "$full" --status queued --json databaseId,createdAt,workflowName --limit 50 2>/dev/null | \
              python3 -c "
          import json,sys,os,subprocess
          from datetime import datetime,timezone
          protected=set(filter(None, os.environ.get('PROTECTED_WORKFLOWS','').split(',')))
          stale_seconds=int(os.environ.get('QUEUED_STALE_SECONDS','2700'))
          runs=json.load(sys.stdin)
          now=datetime.now(timezone.utc)
          for r in runs:
            if r.get('workflowName') in protected:
              continue
            created=datetime.fromisoformat(r['createdAt'].replace('Z','+00:00'))
            if (now-created).total_seconds()>stale_seconds:
              subprocess.run(['gh','run','cancel',str(r['databaseId']),'-R','${full}'], capture_output=True)
          " 2>/dev/null || true

            if [ -n "$AUTO_FIX" ] && echo ",$AUTO_FIX," | grep -q ",${repo},"; then
              gh workflow run nightly-maintenance.yml -R "$full" -f auto-fix=true 2>/dev/null \
                && echo "Triggered auto-fix on ${repo}" >> "$GITHUB_STEP_SUMMARY" \
                || echo "No nightly-maintenance workflow on ${repo}" >> "$GITHUB_STEP_SUMMARY"
            fi
          done < "$REPO_LIST"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "See [reusable workflows](https://github.com/dizhaky/.github/tree/main/.github/workflows) for per-repo maintenance." >> "$GITHUB_STEP_SUMMARY"
