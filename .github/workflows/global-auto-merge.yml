name: Global Auto-Merge Reconciler

on:
  schedule:
    # Half-hourly (was every 15m). Enrollment still needs one GraphQL call
    # per eligible PR (`gh pr merge --auto`); halving cadence cuts shared
    # dizhaky GraphQL spend from this reconciler ~50% (DAN-3334).
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: global-auto-merge-reconciler
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Read trusted default-branch reconciler
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Reconcile active administrator repositories
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_PAT || secrets.GH_PAT }}
        run: python3 scripts/global_auto_merge.py --apply
