name: Global Auto-Merge Reconciler

on:
  schedule:
    # Half-hourly owned-repository reporting. Enrollment belongs solely to
    # the trusted AI delivery controller with fresh executor ownership.
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: global-auto-merge-reconciler
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Read trusted default-branch reconciler
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Report protected owned repositories and delivery holds
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_PAT || secrets.GH_PAT }}
        run: python3 scripts/global_auto_merge.py | tee delivery-report.json
      - name: Retain delivery receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: delivery-receipts-${{ github.run_id }}
          path: delivery-report.json
          retention-days: 90
