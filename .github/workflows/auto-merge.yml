name: Auto-Merge Qualified PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, unlabeled]
  workflow_run:
    workflows:
      - CI
      - ci
      - Tests
      - tests
      - Lint
      - lint
      - Secret Scan
      - secret-scan
      - DeepSeek PR Review
      - deepseek-review
      - Auto-Label PRs
      - Post-Merge Review Payload
      - Post-Merge Review Capture
      - Template tests
    types:
      - completed
  schedule:
    # Half-hourly (was */15). Fleet AUTO_MERGE_PAT is dizhaky (user
    # 213320850); ~18 repos on a shared budget made quarter-hour full
    # sweeps add up. workflow_run / pull_request still cover the hot
    # path; this cron is only the backstop for missed events. DAN-3334.
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: 'Pull request number (leave empty to evaluate all open PRs)'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

concurrency:
  group: auto-merge-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.event.inputs.pull_request_number || github.run_id }}
  cancel-in-progress: false


jobs:
  report:
    if: github.repository_owner == 'dizhaky'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report PR state to the sole AI delivery controller
        env:
          GH_TOKEN: ${{ github.token }}
          DELIVERY_REPOSITORY: ${{ github.repository }}
        run: |
          gh api --paginate --slurp \
            "repos/$DELIVERY_REPOSITORY/pulls?state=open&per_page=100" \
            --jq '[.[][] | {number, draft, head: .head.sha, nativeQueueArmed: (.auto_merge != null)}]'
          echo 'Native enrollment is owned by the authenticated AI delivery controller.'
