name: Secret Scan

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  scan:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/reusable-secret-scan.yml
    with:
      # Public repo: hosted minutes are free, and no self-hosted runner is
      # ever registered on a public repo (fork PRs could reach it).
      runner: '"ubuntu-latest"'
