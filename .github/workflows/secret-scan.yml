name: Secret Scan

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

# Cancel superseded runs of the same PR (new push = old run is moot); pushes
# to main are never cancelled. `push:` is not branch-restricted here, so a
# feature-branch push also groups by ref and cancels its stale run. Cuts load
# on the MFC3 runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.ref != 'refs/heads/main' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

jobs:
  scan:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/reusable-secret-scan.yml
    with:
      # Public repo: hosted minutes are free, and no self-hosted runner is
      # ever registered on a public repo (fork PRs could reach it).
      runner: '"ubuntu-latest"'
