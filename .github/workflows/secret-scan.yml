name: Secret Scan

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

# Cancel superseded runs of the same PR (the newest PR run rescans the whole
# PR diff, so nothing is lost). Push runs are never cancelled, even on feature
# branches: a push scan covers only before..after, so cancelling one would
# leave its commits unscanned. Cuts load on the MFC3 runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/reusable-secret-scan.yml
    with:
      # Public repo: hosted minutes are free, and no self-hosted runner is
      # ever registered on a public repo (fork PRs could reach it).
      runner: '"ubuntu-latest"'
