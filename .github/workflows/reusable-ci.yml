name: Reusable CI
on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "20"
      python-version:
        type: string
        default: "3.12"
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      - name: Setup Python
        if: hashFiles('pyproject.toml') != '' || hashFiles('requirements.txt') != ''
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - name: Lint + Test + Build (auto-detect)
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
            npm run lint --if-present
            npm test --if-present -- --ci || true
            npm run build --if-present
          elif [ -f pyproject.toml ] || [ -f requirements.txt ]; then
            python -m pip install --upgrade pip
            [ -f requirements.txt ] && pip install -r requirements.txt
            [ -f pyproject.toml ] && pip install .
            pip install ruff pytest || true
            ruff check . || true
            pytest || true
          else
            echo "No recognized project type; nothing to do."
          fi
