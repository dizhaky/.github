name: Reusable Secret Scan

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Scan for secrets
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.event.pull_request.base.ref }}"
            BASE=$(git merge-base "origin/${{ github.event.pull_request.base.ref }}" HEAD)
            echo "Scanning PR diff: ${BASE}..HEAD"
            gitleaks detect --redact --exit-code 1 --log-opts="${BASE}..HEAD"
          else
            gitleaks detect --redact --exit-code 1
          fi
