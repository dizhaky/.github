name: Reusable Secret Scan

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Scan for secrets
        id: scan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Without --report-path the finding record is discarded when gitleaks
          # exits, so a failure says only "leaks found: N" with no file, line or
          # rule. --redact still masks Match/Secret inside the report, so this
          # records where to look without restating the secret.
          REPORT=(--report-format json --report-path gitleaks-report.json)
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_REF"
            BASE=$(git merge-base "origin/${BASE_REF}" HEAD)
            echo "Scanning PR diff: ${BASE}..HEAD"
            gitleaks detect --redact --exit-code 1 "${REPORT[@]}" --log-opts="${BASE}..HEAD"
          elif [ -n "$BEFORE_SHA" ] \
            && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null \
            && git merge-base --is-ancestor "$BEFORE_SHA" "$AFTER_SHA" 2>/dev/null; then
            echo "Scanning push diff: ${BEFORE_SHA}..${AFTER_SHA}"
            gitleaks detect --redact --exit-code 1 "${REPORT[@]}" --log-opts="${BEFORE_SHA}..${AFTER_SHA}"
          elif git rev-parse HEAD~1 >/dev/null 2>&1; then
            echo "Scanning latest commit (parent SHA missing after rewrite)"
            gitleaks detect --redact --exit-code 1 "${REPORT[@]}" --log-opts="HEAD~1..HEAD"
          else
            echo "Scanning root commit"
            gitleaks detect --redact --exit-code 1 "${REPORT[@]}" --log-opts="HEAD"
          fi

      - name: Report finding locations
        if: failure() && steps.scan.outcome == 'failure'
        shell: bash
        run: |
          set -uo pipefail
          REPORT=gitleaks-report.json
          {
            echo "## Secret scan findings"
            echo ""
            if [ ! -s "$REPORT" ]; then
              echo "No gitleaks report was written - the scan failed before producing one."
              echo "See the \"Scan for secrets\" step log above for the underlying error."
            elif [ "$(jq 'length' "$REPORT")" = "0" ]; then
              echo "The report contains no findings; this job failed for another reason."
            else
              echo "**$(jq 'length' "$REPORT") finding(s).** Secret values are redacted;"
              echo "the locations below are where to look."
              echo ""
              echo '```'
              jq -r '.[] | "\(.File):\(.StartLine)  rule=\(.RuleID)  commit=\(if .Commit == "" then "working-tree" else .Commit[0:8] end)\n    \(.Description)"' "$REPORT"
              echo '```'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore
