name: Reusable Secret Scan

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Scan for secrets
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_REF"
            BASE=$(git merge-base "origin/${BASE_REF}" HEAD)
            echo "Scanning PR diff: ${BASE}..HEAD"
            gitleaks detect --redact --exit-code 1 --log-opts="${BASE}..HEAD"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            echo "Scanning push diff: ${BEFORE_SHA}..${AFTER_SHA}"
            gitleaks detect --redact --exit-code 1 --log-opts="${BEFORE_SHA}..${AFTER_SHA}"
          else
            echo "Scanning latest commit only"
            gitleaks detect --redact --exit-code 1 --log-opts="HEAD~1..HEAD"
          fi
