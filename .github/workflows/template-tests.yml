name: Template tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# Cancel superseded runs of the same PR (new push = old run is moot); pushes
# to main and scheduled runs are never cancelled. Cuts load on the MFC3 runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONHASHSEED: '0'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_METADATA_SERVICE_TIMEOUT: '1'
      AWS_METADATA_SERVICE_NUM_ATTEMPTS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install 'pytest>=8,<10'
      - run: python -m pytest -q tests
